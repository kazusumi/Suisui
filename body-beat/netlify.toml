# BODY BEAT 用の Netlify 設定。
# Netlify のサイト設定で Base directory を "body-beat" にすると、このファイルが使われる。
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
