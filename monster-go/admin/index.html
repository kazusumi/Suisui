<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MONSTER GO 管理</title>
  </head>
  <body class="admin">
    <header class="admin-header">
      <h1>MONSTER GO <span>管理画面</span></h1>
      <nav>
        <a href="/admin/db.html">🗄 DBビューア</a>
        <a href="/" target="_blank">🎮 ゲーム</a>
        <button class="btn small" id="logoutBtn" type="button">ログアウト</button>
      </nav>
    </header>

    <main class="admin-main" id="app" hidden>
      <div class="tabs" role="tablist">
        <button type="button" data-tab="portals">💠 ポータル</button>
        <button type="button" data-tab="gyms">🏟️ ジム</button>
        <button type="button" data-tab="monsters">👾 モンスター</button>
        <button type="button" data-tab="spawns">📍 出現地点</button>
      </div>

      <div class="admin-grid">
        <section class="panel map-panel" id="mapPanel">
          <div id="adminMap"></div>
          <p class="muted map-hint">地図をクリックすると、フォームの緯度・経度に入ります。マーカーをクリックすると編集できます。</p>
          <details class="generate">
            <summary>🎲 地図の中心付近にランダム生成（テスト用）</summary>
            <form id="genForm" class="gen-form">
              <label class="field">ポータル<input type="number" name="portals" value="5" min="0" max="50" /></label>
              <label class="field">ジム<input type="number" name="gyms" value="2" min="0" max="20" /></label>
              <label class="field">モンスター<input type="number" name="spawns" value="10" min="0" max="100" /></label>
              <label class="field">半径(m)<input type="number" name="radius" value="400" min="50" max="3000" /></label>
              <button class="btn primary" type="submit">生成する</button>
            </form>
          </details>
        </section>

        <section class="panel">
          <h2 id="formTitle">新規登録</h2>
          <form id="editForm" class="edit-form"></form>
        </section>
      </div>

      <section class="panel">
        <div class="list-head">
          <h2 id="listTitle">一覧</h2>
          <span class="muted" id="listCount"></span>
        </div>
        <div class="table-wrap"><table class="data-table" id="listTable"></table></div>
      </section>
    </main>

    <div class="modal" id="loginModal" hidden>
      <form class="modal-card" id="loginForm">
        <h2>管理画面ログイン</h2>
        <p class="muted">Netlify の環境変数 ADMIN_PASSWORD に設定したパスワードを入力してください。</p>
        <label class="field">パスワード<input type="password" name="password" required autocomplete="current-password" /></label>
        <div class="modal-actions"><button class="btn primary" type="submit">ログイン</button></div>
      </form>
    </div>

    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
