<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MONSTER GO DBビューア</title>
  </head>
  <body class="admin">
    <header class="admin-header">
      <h1>MONSTER GO <span>DBビューア</span></h1>
      <nav>
        <a href="/admin/">✏️ 管理画面</a>
        <a href="/" target="_blank">🎮 ゲーム</a>
        <button class="btn small" id="logoutBtn" type="button">ログアウト</button>
      </nav>
    </header>

    <main class="admin-main db-main" id="app" hidden>
      <aside class="panel db-side">
        <h2>テーブル</h2>
        <p class="muted" id="driverInfo"></p>
        <ul class="table-list" id="tableList"></ul>
        <button class="btn small wide" id="refreshBtn" type="button">↻ 再読み込み</button>
      </aside>
      <section class="panel db-content">
        <div class="list-head">
          <h2 id="tableTitle">テーブルを選んでください</h2>
          <span class="muted" id="tableCount"></span>
        </div>
        <details class="columns-info" id="columnsInfo" hidden>
          <summary>列の定義</summary>
          <div class="table-wrap"><table class="data-table" id="columnsTable"></table></div>
        </details>
        <div class="table-wrap"><table class="data-table" id="rowsTable"></table></div>
        <div class="pager" id="pager" hidden>
          <button class="btn small" id="prevBtn" type="button">← 前へ</button>
          <span id="pageInfo" class="muted"></span>
          <button class="btn small" id="nextBtn" type="button">次へ →</button>
          <label class="muted">表示件数
            <select id="limitSel"><option>20</option><option selected>50</option><option>100</option><option>500</option></select>
          </label>
        </div>
      </section>
    </main>

    <div class="modal" id="loginModal" hidden>
      <form class="modal-card" id="loginForm">
        <h2>管理画面ログイン</h2>
        <p class="muted">Netlify の環境変数 ADMIN_PASSWORD に設定したパスワードを入力してください。</p>
        <label class="field">パスワード<input type="password" name="password" required autocomplete="current-password" /></label>
        <div class="modal-actions"><button class="btn primary" type="submit">ログイン</button></div>
      </form>
    </div>

    <script type="module" src="/src/db.js"></script>
  </body>
</html>
